name: Build and push to GHCR

# On every merge to main, build the application image and push it to the
# GitHub Container Registry (ghcr.io).
#
# Tags: `latest` + a unix-epoch tag (monotonically increasing, easy to sort,
# as noted in ideas.md). No PAT is needed: the built-in GITHUB_TOKEN can push
# to this repository's own package.
#
# Roadmap (still TODO, per ideas.md): on merge, *also* run the test suite and a
# Trivy vulnerability scan, and have the deployment agent pull from GHCR
# (ghcr.io/.../ai-agent:<epoch>) instead of building locally.

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # least-privilege scopes for this job:
    permissions:
      actions: read    # for the GHA layer cache (cache-from/cache-to: type=gha)
      packages: write  # to push the image to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version tag (unix epoch)
        id: tag
        run: echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      # Build and push. `cache-from`/`cache-to: type=gha` reuse the GHA cache
      # between runs so only the changed layers are rebuilt.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Pass `tags` as a newline-separated block scalar, NOT a YAML sequence.
          # build-push-action accepts a comma/newline-separated tag list, and a
          # block scalar sidesteps a GitHub-Actions parser quirk where a `tags:`
          # sequence of `${{ }}`-expressing list items fails to parse
          # ("A sequence was not expected", Line 52) even though it is valid YAML.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.tag.epoch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm what was pushed
        run: |
          echo "Pushed to GHCR:"
          echo "  ghcr.io/${{ github.repository }}:latest"
          echo "  ghcr.io/${{ github.repository }}:${{ steps.tag.epoch }}"
